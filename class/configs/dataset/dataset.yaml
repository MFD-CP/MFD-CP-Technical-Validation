preprocessed_root: preprocessed_data/class
fabric_ids: [41, 46, 70, 112, 134, 155, 207, 211, 216, 266]

offline:
  temporal_pattern: temporal_{split}.h5
  gelsight_pattern: gelsight_{split}.pt
  visual_pattern: visual_{split}.pt
  trial_manifest: trial_split_manifest.csv
  pairing_seed: 20260730

seed: 42

splits:
  train: 0.70
  val: 0.10
  test: 0.20
  stratify_by_label: true

window:
  length_sec: 0.5
  overlap: 0.5
  min_coverage: 0.5

audio:
  sample_rate: 44100
  n_mels: 64
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  top_db: 80.0

accel:
  sample_rate: 3000
  channels: 3

gelsight:
  image_size: 224
  frames_per_window: 3
  selection_seed: 20260730

visual:
  image_size: 224

features:
  cache_dir: cache/class
  save_hdf5: true
  enable_pca: false
  pca_components: 128

feature_exports:
  enabled: true
  output_dir: class/results/features
  save_csv: true
  save_hdf5: true
  save_parquet: false
  save_feature_manifest: true
  save_config_snapshot: true

missing_modalities:
  policy: skip
